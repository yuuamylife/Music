<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ボイス＆ピアノ 作曲アプリ (小節線・本格休符対応版)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #12131C;
      color: #fff;
      font-family: 'Mochiy Pop One', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    header {
      background: #1c1e2d;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #2e3248;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 0.95rem;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #2b2e45;
      color: #fff;
      border: 2px solid #454968;
      padding: 6px 12px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 #181926;
      transition: all 0.1s;
    }

    .btn:active, .btn.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #181926;
    }

    .btn-rec {
      background: #ff3366;
      border-color: #ff6688;
    }

    .btn-rec.recording {
      animation: pulse 1s infinite alternate;
      background: #ff0044;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 5px #ff0044; }
      100% { box-shadow: 0 0 20px #ff0044; }
    }

    .btn-play {
      background: #00cc88;
      border-color: #33ffaa;
    }

    .metro-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #161722;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid #2a2d42;
      font-size: 0.75rem;
    }

    .note-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #161722;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid #2a2d42;
    }

    .note-opt {
      background: #222538;
      border: 1px solid #444;
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .note-opt.selected {
      background: #00ffcc;
      color: #000;
      border-color: #fff;
    }

    .btn-rest {
      background: #ff5500;
      border-color: #ff8844;
      color: #fff;
    }

    #score-area {
      flex: 1;
      background: #181926;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
    }

    svg#sheet {
      height: 100%;
      min-width: 100%;
      background: #1a1b2a;
    }

    #keyboard-area {
      height: 190px;
      background: #0f1017;
      border-top: 3px solid #ff5500;
      position: relative;
      display: flex;
      justify-content: center;
      padding: 8px 10px 30px;
    }

    .piano-container {
      position: relative;
      display: flex;
      height: 100%;
      width: 100%;
      max-width: 800px;
    }

    .white-key {
      flex: 1;
      background: linear-gradient(to bottom, #eeeeee 0%, #ffffff 100%);
      border: 1px solid #bbb;
      border-bottom: 5px solid #999;
      border-radius: 0 0 6px 6px;
      position: relative;
      z-index: 1;
      cursor: pointer;
    }

    .white-key:active, .white-key.active {
      background: #00ffcc;
      border-bottom-width: 2px;
      transform: translateY(3px);
    }

    .black-key {
      position: absolute;
      width: 6.5%;
      height: 58%;
      background: linear-gradient(to bottom, #333 0%, #000 100%);
      border-radius: 0 0 4px 4px;
      z-index: 2;
      border: 1px solid #000;
      border-bottom: 4px solid #222;
      cursor: pointer;
    }

    .black-key:active, .black-key.active {
      background: #ff5500;
      border-bottom-width: 1px;
      transform: translateY(2px);
    }

    #status-box {
      position: absolute;
      top: 10px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      pointer-events: none;
    }

    #pitch-indicator {
      background: rgba(0,0,0,0.75);
      padding: 4px 10px;
      border-radius: 10px;
      color: #00ffcc;
      font-size: 0.8rem;
    }

    #mic-meter-bg {
      width: 120px;
      height: 8px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #444;
    }

    #mic-meter-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #00ffcc, #ff3366);
      transition: width 0.05s;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <div class="title">🎵 歌＆ピアノ作曲</div>
      
      <div class="controls">
        <div class="note-selector">
          <span style="font-size:0.7rem; color:#aaa;">音符:</span>
          <button class="note-opt" data-type="1">全</button>
          <button class="note-opt" data-type="2">2分</button>
          <button class="note-opt selected" data-type="4">4分</button>
          <button class="note-opt" data-type="8">8分</button>
        </div>

        <button class="btn btn-rest" id="btn-add-rest">𝄽 休符追加</button>

        <div class="metro-group">
          <label><input type="checkbox" id="metro-toggle"> ⏱ メトロノーム</label>
          <input type="range" id="bpm-slider" min="60" max="180" value="100" style="width:50px;">
          <span id="bpm-val">100</span>
        </div>

        <button class="btn btn-rec" id="btn-rec">🎙️ 歌って録音</button>
        <button class="btn btn-play" id="btn-play">▶ 再生</button>
        <button class="btn" id="btn-clear">🗑️ クリア</button>
      </div>
    </header>

    <div id="score-area">
      <div id="status-box">
        <div id="pitch-indicator">マイク待機中...</div>
        <div id="mic-meter-bg"><div id="mic-meter-bar"></div></div>
      </div>

      <svg id="sheet" viewBox="0 0 1600 200" preserveAspectRatio="xMinYMid meet">
        <!-- 五線 -->
        <line x1="0" y1="60" x2="1600" y2="60" stroke="#555770" stroke-width="2"/>
        <line x1="0" y1="80" x2="1600" y2="80" stroke="#555770" stroke-width="2"/>
        <line x1="0" y1="100" x2="1600" y2="100" stroke="#555770" stroke-width="2"/>
        <line x1="0" y1="120" x2="1600" y2="120" stroke="#555770" stroke-width="2"/>
        <line x1="0" y1="140" x2="1600" y2="140" stroke="#555770" stroke-width="2"/>
        
        <!-- ト音記号 ＆ 拍子記号(4/4) -->
        <text x="15" y="130" font-size="70" fill="#00ffcc" font-family="sans-serif">𝄞</text>
        <text x="65" y="95" font-size="30" fill="#00ffcc" font-family="sans-serif">4</text>
        <text x="65" y="135" font-size="30" fill="#00ffcc" font-family="sans-serif">4</text>
        
        <g id="notes-layer"></g>
        <line id="play-cursor" x1="110" y1="30" x2="110" y2="170" stroke="#ff5500" stroke-width="3" visibility="hidden"/>
      </svg>
    </div>

    <div id="keyboard-area">
      <div class="piano-container" id="piano"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let selectedNoteType = 4; // 1, 2, 4, 8

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('click', initAudio, { once: true });

    document.querySelectorAll('.note-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.note-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedNoteType = parseInt(btn.dataset.type);
      });
    });

    const NOTES = [
      { name: 'C4', freq: 261.63, keyType: 'white', lineY: 160, isLedger: true },
      { name: 'C#4', freq: 277.18, keyType: 'black', lineY: 160 },
      { name: 'D4', freq: 293.66, keyType: 'white', lineY: 150 },
      { name: 'D#4', freq: 311.13, keyType: 'black', lineY: 150 },
      { name: 'E4', freq: 329.63, keyType: 'white', lineY: 140 },
      { name: 'F4', freq: 349.23, keyType: 'white', lineY: 130 },
      { name: 'F#4', freq: 369.99, keyType: 'black', lineY: 130 },
      { name: 'G4', freq: 392.00, keyType: 'white', lineY: 120 },
      { name: 'G#4', freq: 415.30, keyType: 'black', lineY: 120 },
      { name: 'A4', freq: 440.00, keyType: 'white', lineY: 110 },
      { name: 'A#4', freq: 466.16, keyType: 'black', lineY: 110 },
      { name: 'B4', freq: 493.88, keyType: 'white', lineY: 100 },
      { name: 'C5', freq: 523.25, keyType: 'white', lineY: 90 },
      { name: 'C#5', freq: 554.37, keyType: 'black', lineY: 90 },
      { name: 'D5', freq: 587.33, keyType: 'white', lineY: 80 },
      { name: 'D#5', freq: 622.25, keyType: 'black', lineY: 80 },
      { name: 'E5', freq: 659.25, keyType: 'white', lineY: 70 },
      { name: 'F5', freq: 698.46, keyType: 'white', lineY: 60 },
      { name: 'F#5', freq: 739.99, keyType: 'black', lineY: 60 },
      { name: 'G5', freq: 783.99, keyType: 'white', lineY: 50 },
    ];

    function playTone(freq, duration = 0.5) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const pianoEl = document.getElementById('piano');
    const whiteNotes = NOTES.filter(n => n.keyType === 'white');

    whiteNotes.forEach(note => {
      const wKey = document.createElement('div');
      wKey.className = 'white-key';
      
      const trigger = (e) => {
        e.preventDefault();
        playTone(note.freq, getDurationFromType(selectedNoteType));
        addNoteToSheet(note, selectedNoteType);
        wKey.classList.add('active');
        setTimeout(() => wKey.classList.remove('active'), 200);
      };
      
      wKey.addEventListener('touchstart', trigger);
      wKey.addEventListener('mousedown', trigger);
      pianoEl.appendChild(wKey);
    });

    const blackKeyIndexes = [
      { noteName: 'C#4', leftIndex: 0 }, { noteName: 'D#4', leftIndex: 1 },
      { noteName: 'F#4', leftIndex: 3 }, { noteName: 'G#4', leftIndex: 4 }, { noteName: 'A#4', leftIndex: 5 },
      { noteName: 'C#5', leftIndex: 7 }, { noteName: 'D#5', leftIndex: 8 }, { noteName: 'F#5', leftIndex: 10 }
    ];

    blackKeyIndexes.forEach(b => {
      const note = NOTES.find(n => n.name === b.noteName);
      if (!note) return;

      const bKey = document.createElement('div');
      bKey.className = 'black-key';
      const percentLeft = ((b.leftIndex + 1) / whiteNotes.length * 100) - 3.25;
      bKey.style.left = `${percentLeft}%`;

      const trigger = (e) => {
        e.preventDefault();
        e.stopPropagation();
        playTone(note.freq, getDurationFromType(selectedNoteType));
        addNoteToSheet(note, selectedNoteType);
        bKey.classList.add('active');
        setTimeout(() => bKey.classList.remove('active'), 200);
      };

      bKey.addEventListener('touchstart', trigger);
      bKey.addEventListener('mousedown', trigger);
      pianoEl.appendChild(bKey);
    });

    document.getElementById('btn-add-rest').addEventListener('click', () => {
      addNoteToSheet({ name: 'REST', lineY: 100 }, selectedNoteType, true);
    });

    function getDurationFromType(type) {
      const bpm = parseInt(document.getElementById('bpm-slider').value);
      const beatSec = 60 / bpm;
      if (type === 1) return beatSec * 4;
      if (type === 2) return beatSec * 2;
      if (type === 4) return beatSec;
      if (type === 8) return beatSec * 0.5;
      return beatSec;
    }

    let recordedNotes = [];
    const notesLayer = document.getElementById('notes-layer');

    function addNoteToSheet(note, type = 4, isRest = false) {
      const noteData = { ...note, type, isRest };
      recordedNotes.push(noteData);
      renderSheet();
    }

    function renderSheet() {
      notesLayer.innerHTML = '';
      let currentX = 110;
      let beatsInMeasure = 0; // 4/4拍子用カウント（4拍で小節線）

      recordedNotes.forEach((n, idx) => {
        // 拍数の加算 (全音符=4, 2分=2, 4分=1, 8分=0.5)
        let beats = 4 / n.type;
        
        // 小節線の描画（4拍を超えたタイミングで縦線を挿入）
        if (beatsInMeasure + beats > 4) {
          drawBarLine(currentX + 10);
          currentX += 30;
          beatsInMeasure = 0;
        }

        n.x = currentX;

        if (n.isRest) {
          drawRestSymbol(n.x, n.type);
        } else {
          // 下加線
          if (n.isLedger) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', n.x - 10);
            line.setAttribute('y1', n.lineY);
            line.setAttribute('x2', n.x + 10);
            line.setAttribute('y2', n.lineY);
            line.setAttribute('stroke', '#fff');
            line.setAttribute('stroke-width', '2');
            notesLayer.appendChild(line);
          }

          // 音符の玉
          const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          ellipse.setAttribute('cx', n.x);
          ellipse.setAttribute('cy', n.lineY);
          ellipse.setAttribute('rx', '7');
          ellipse.setAttribute('ry', '5');
          ellipse.setAttribute('fill', (n.type === 1 || n.type === 2) ? '#1a1b2a' : '#00ffcc');
          ellipse.setAttribute('stroke', '#00ffcc');
          ellipse.setAttribute('stroke-width', '2');
          ellipse.setAttribute('transform', `rotate(-20 ${n.x} ${n.lineY})`);
          notesLayer.appendChild(ellipse);

          // 符幹（棒）
          if (n.type !== 1) {
            const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            stem.setAttribute('x1', n.x + 6);
            stem.setAttribute('y1', n.lineY);
            stem.setAttribute('x2', n.x + 6);
            stem.setAttribute('y2', n.lineY - 28);
            stem.setAttribute('stroke', '#00ffcc');
            stem.setAttribute('stroke-width', '2');
            notesLayer.appendChild(stem);

            if (n.type === 8) {
              const flag = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              flag.setAttribute('d', `M ${n.x + 6} ${n.lineY - 28} Q ${n.x + 16} ${n.lineY - 18} ${n.x + 12} ${n.lineY - 10}`);
              flag.setAttribute('stroke', '#00ffcc');
              flag.setAttribute('stroke-width', '2.5');
              flag.setAttribute('fill', 'none');
              notesLayer.appendChild(flag);
            }
          }
        }

        beatsInMeasure += beats;

        if (beatsInMeasure === 4) {
          drawBarLine(currentX + 25);
          currentX += 45;
          beatsInMeasure = 0;
        } else {
          let spacing = 35;
          if (n.type === 1) spacing = 70;
          else if (n.type === 2) spacing = 50;
          else if (n.type === 8) spacing = 25;
          currentX += spacing;
        }
      });
    }

    // 小節線描画
    function drawBarLine(x) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x);
      line.setAttribute('y1', 60);
      line.setAttribute('x2', x);
      line.setAttribute('y2', 140);
      line.setAttribute('stroke', '#ff5500');
      line.setAttribute('stroke-width', '2.5');
      notesLayer.appendChild(line);
    }

    // 正確な休符SVG描画
    function drawRestSymbol(x, type) {
      if (type === 1) { // 全休符（第4線からぶら下がる）
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x - 6);
        rect.setAttribute('y', 80);
        rect.setAttribute('width', 12);
        rect.setAttribute('height', 6);
        rect.setAttribute('fill', '#ff5500');
        notesLayer.appendChild(rect);
      } else if (type === 2) { // 二分休符（第3線の上に乗る）
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x - 6);
        rect.setAttribute('y', 94);
        rect.setAttribute('width', 12);
        rect.setAttribute('height', 6);
        rect.setAttribute('fill', '#ff5500');
        notesLayer.appendChild(rect);
      } else if (type === 4) { // 四分休符
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x-3} 75 L ${x+4} 85 L ${x-3} 95 L ${x+3} 105 Q ${x-5} 115 ${x-2} 120`);
        path.setAttribute('stroke', '#ff5500');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('fill', 'none');
        notesLayer.appendChild(path);
      } else if (type === 8) { // 八分休符
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x - 3);
        circle.setAttribute('cy', 90);
        circle.setAttribute('r', 3);
        circle.setAttribute('fill', '#ff5500');
        notesLayer.appendChild(circle);

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x-3} 88 Q ${x+4} 90 ${x+2} 98 L ${x-4} 115`);
        path.setAttribute('stroke', '#ff5500');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('fill', 'none');
        notesLayer.appendChild(path);
      }
    }

    // 高精度＆スムージングマイク処理
    let isRecording = false;
    let micStream = null;
    let analyser = null;
    const btnRec = document.getElementById('btn-rec');
    const pitchIndicator = document.getElementById('pitch-indicator');
    const micMeterBar = document.getElementById('mic-meter-bar');

    let pitchHistory = [];
    let currentStableNote = null;
    let noteStartTime = 0;
    let silenceStartTime = Date.now();

    btnRec.addEventListener('click', async () => {
      initAudio();
      if (!isRecording) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, autoGainControl: true, noiseSuppression: false }
          });

          const source = audioCtx.createMediaStreamSource(micStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          isRecording = true;
          btnRec.classList.add('recording');
          btnRec.textContent = '⏹ 録音停止';
          pitchIndicator.textContent = '聴き取り中...';
          silenceStartTime = Date.now();

          detectPitchSmooth();
        } catch (err) {
          alert('マイクを起動できませんでした。ブラウザの権限をご確認ください。');
        }
      } else {
        stopRecording();
      }
    });

    function stopRecording() {
      isRecording = false;
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      btnRec.classList.remove('recording');
      btnRec.textContent = '🎙️ 歌って録音';
      pitchIndicator.textContent = 'マイク待機中...';
      micMeterBar.style.width = '0%';
    }

    function detectPitchSmooth() {
      if (!isRecording) return;

      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);

      let rms = 0;
      for (let i = 0; i < buffer.length; i++) rms += buffer[i] * buffer[i];
      rms = Math.sqrt(rms / buffer.length);

      micMeterBar.style.width = `${Math.min(100, rms * 450)}%`;

      const bpm = parseInt(document.getElementById('bpm-slider').value);
      const beatSec = 60 / bpm;
      const now = Date.now();

      if (rms > 0.035) {
        const freq = autoCorrelate(buffer, audioCtx.sampleRate);
        if (freq !== -1) {
          pitchHistory.push(freq);
          if (pitchHistory.length > 5) pitchHistory.shift();

          const avgFreq = pitchHistory.reduce((a, b) => a + b, 0) / pitchHistory.length;
          const closestNote = NOTES.reduce((prev, curr) => 
            Math.abs(curr.freq - avgFreq) < Math.abs(prev.freq - avgFreq) ? curr : prev
          );

          pitchIndicator.textContent = `音階: ${closestNote.name}`;

          if (silenceStartTime > 0) {
            const silenceDuration = (now - silenceStartTime) / 1000;
            if (silenceDuration >= beatSec * 0.75) {
              const restType = calculateNoteType(silenceDuration, beatSec);
              addNoteToSheet({ name: 'REST', lineY: 100 }, restType, true);
            }
            silenceStartTime = 0;
          }

          if (!currentStableNote) {
            currentStableNote = closestNote;
            noteStartTime = now;
          } else if (currentStableNote.name !== closestNote.name) {
            const duration = (now - noteStartTime) / 1000;
            if (duration >= 0.2) {
              const noteType = calculateNoteType(duration, beatSec);
              addNoteToSheet(currentStableNote, noteType);
              currentStableNote = closestNote;
              noteStartTime = now;
            }
          }
        }
      } else {
        if (currentStableNote) {
          const duration = (now - noteStartTime) / 1000;
          if (duration >= 0.18) {
            const noteType = calculateNoteType(duration, beatSec);
            addNoteToSheet(currentStableNote, noteType);
          }
          currentStableNote = null;
          silenceStartTime = now;
          pitchHistory = [];
        }
        pitchIndicator.textContent = '（無音）';
      }

      requestAnimationFrame(detectPitchSmooth);
    }

    function calculateNoteType(durationSec, beatSec) {
      const beats = durationSec / beatSec;
      if (beats >= 3.0) return 1;
      if (beats >= 1.5) return 2;
      if (beats >= 0.75) return 4;
      return 8;
    }

    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let r1 = 0, r2 = SIZE - 1, thres = 0.1;
      for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++)
        for (let j = 0; j < SIZE - i; j++)
          c[i] = c[i] + buf[j] * buf[j + i];

      let d = 0; while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      return maxpos !== -1 ? sampleRate / maxpos : -1;
    }

    const metroToggle = document.getElementById('metro-toggle');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmVal = document.getElementById('bpm-val');
    let metroInterval = null;

    bpmSlider.addEventListener('input', () => {
      bpmVal.textContent = bpmSlider.value;
      if (metroToggle.checked) startMetronome();
    });

    metroToggle.addEventListener('change', () => {
      if (metroToggle.checked) startMetronome();
      else clearInterval(metroInterval);
    });

    function startMetronome() {
      clearInterval(metroInterval);
      const intervalMs = (60 / parseInt(bpmSlider.value)) * 1000;
      metroInterval = setInterval(() => {
        if (metroToggle.checked) playTone(800, 0.05);
      }, intervalMs);
    }

    const btnPlay = document.getElementById('btn-play');
    const playCursor = document.getElementById('play-cursor');

    btnPlay.addEventListener('click', () => {
      initAudio();
      if (recordedNotes.length === 0) return;

      playCursor.setAttribute('visibility', 'visible');
      let i = 0;

      function playNext() {
        if (i >= recordedNotes.length) {
          playCursor.setAttribute('visibility', 'hidden');
          return;
        }

        const note = recordedNotes[i];
        const durationSec = getDurationFromType(note.type);

        if (!note.isRest) {
          playTone(note.freq, durationSec);
        }

        playCursor.setAttribute('x1', note.x);
        playCursor.setAttribute('x2', note.x);

        i++;
        setTimeout(playNext, durationSec * 1000);
      }

      playNext();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      recordedNotes = [];
      renderSheet();
    });
  </script>
</body>
